<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>


    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <div class="app-container">

        <h1>My Profile</h1>

        <p class="subtitle">
            Your account information
        </p>


        <!-- Profile information -->
        <div class="profile-card">

            <!-- Name -->
            <label>
                Name
            </label>

            <p id="profileName">
                Loading...
            </p>


            <!-- Email -->
            <label>
                Email
            </label>

            <p id="profileEmail">
                Loading...
            </p>

        </div>


        <!-- Back to dashboard -->
        <a href="/dashboard">

            <button>
                Back to Dashboard
            </button>

        </a>


        <!-- Logout -->
        <button id="logoutButton">
            Logout
        </button>

    </div>


    <script src="/script.js"></script>

</body>

</html>
