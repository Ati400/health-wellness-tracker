<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    
    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <div class="app-container">

        
        <h1 id="welcomeMessage">
            Welcome!
        </h1>

        <p class="subtitle">
            Your health and wellness journey starts here.
        </p>


        <!-- Water section -->
        <div class="dashboard-card">

            <h3>Water</h3>

            <p>
                Water tracking coming soon.
            </p>

        </div>


        <!-- Workout section -->
        <div class="dashboard-card">

            <h3>Workouts</h3>

            <p>
                Workout tracking coming soon.
            </p>

        </div>


        <!-- Sleep section -->
        <div class="dashboard-card">

            <h3>Sleep</h3>

            <p>
                Sleep tracking coming soon.
            </p>

        </div>


        <!-- Nutrition section -->
        <div class="dashboard-card">

            <h3>Nutrition</h3>

            <p>
                Nutrition tracking coming soon.
            </p>

        </div>


        <!-- Open profile page -->
        <a href="/profile">
            <button>
                My Profile
            </button>
        </a>


        <!-- Logout -->
        <button id="logoutButton">
            Logout
        </button>

    </div>


    <script src="/script.js"></script>

</body>

</html>
