<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the website fit correctly on phones -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Health and Wellness Tracker</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <!-- Main mobile-style application -->
    <div class="app-container">

        <h1>Health and Wellness</h1>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to continue tracking your wellness.
        </p>


        <!-- Login form -->
        <form action="/login" method="POST">

            <!-- Email -->
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <!-- Password -->
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <!-- Login button -->
            <button type="submit">
                Login
            </button>

        </form>
		
	</div>

</body>

</html>
