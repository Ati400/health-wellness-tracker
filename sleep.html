<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTrack - Sleep</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2 class="sidebar-logo">LifeTrack</h2>
        <p class="sidebar-subtitle">Health & Wellness</p>

        <nav class="sidebar-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/progress">My Progress</a>
            <a href="/water">Water</a>
            <a href="/workouts">Workouts</a>
            <a href="/sleep" class="active">Sleep</a>
            <a href="/nutrition">Nutrition</a>
            <a href="/profile">My Profile</a>
        </nav>

        <a href="/logout" class="sidebar-logout">
            Logout
        </a>

    </aside>

    <!-- main content -->
    <main class="dashboard-main">

        <header class="dashboard-header">
            <div>
                <p class="section-label">DAILY WELLNESS TRACKING</p>
                <h1>Sleep Tracking</h1>
                <p class="subtitle">
                    Track your sleep and build healthy habits.
                </p>
            </div>
        </header>

        <!-- sleep form -->
        <section class="tracking-panel">

            <h2>Add Sleep Entry</h2>

            <p class="tracking-description">
                Record how many hours you slept.
            </p>

            <form action="/sleep" method="POST">

                <label for="hours">Hours of Sleep</label>
                <input
                    type="number"
                    id="hours"
                    name="hours"
                    placeholder="Example: 8"
                    min="0.1"
                    max="24"
                    step="0.1"
                    required
                >

                <button type="submit">Save Sleep</button>

            </form>

        </section>

    </main>

</div>

</body>
</html>
