<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the page mobile friendly -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Connect our CSS -->
    <link rel="stylesheet" href="/style.css">

</head>


<body>

    <div class="app-container">

        <h1>Health and Wellness</h1>

        <h2>Create Account</h2>

        <p class="subtitle">
            Create an account to start tracking your wellness.
        </p>


        <!-- Registration form -->
        <form action="/create-account" method="POST">

            <!-- Name -->
            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >


            <!-- Email -->
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


			<!-- Password -->
			<label for="password">
				Password
			</label>

			<input
				type="password"
				id="password"
				name="password"
				placeholder="Create a password"
				required
			>

			<!-- Tell the user the password requirement -->
			<p class="password-info">
				Password must be at least 8 characters.
			</p>


            <!-- Create account button -->
            <button type="submit">
                Create Account
            </button>

        </form>


        <!-- Error if the email already exists -->
        <p
            id="emailError"
            class="error-message"
        >
            An account with this email already exists.
        </p>


        <!-- Return to login -->
        <p class="bottom-text">

            Already have an account?

            <a href="/">
                Login
            </a>

        </p>

    </div>


    <script src="/script.js"></script>

</body>

</html>
