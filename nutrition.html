<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeTrack - Nutrition</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="dashboard-page">

<div class="dashboard-layout">


	<!-- Sidebar -->
	<aside class="sidebar">

        <h2 class="sidebar-logo">LifeTrack</h2>
        <p class="sidebar-subtitle">Health & Wellness</p>

        <nav class="sidebar-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/progress">My Progress</a>
            <a href="/water">Water</a>
            <a href="/workouts">Workouts</a>
            <a href="/sleep">Sleep</a>
            <a href="/nutrition" class="active">Nutrition</a>
            <a href="/profile">My Profile</a>
        </nav>

        <a href="/logout" class="sidebar-logout">
            Logout
        </a>

    </aside>

    <!-- Main content -->
    <main class="dashboard-main">
    
		<header class="dashboard-header">
            <div>
                <p class="section-label">DAILY WELLNESS TRACKING</p>
                <h1>Nutrition Tracking</h1>
                <p class="subtitle">
                    Track your daily food intake and calories.
                </p>
            </div>
        </header>
        
        <!-- Nutrition form -->
        <section class="tracking-panel">

            <h2>Add Food Entry</h2>

            <p class="tracking-description">
                Enter the food you ate and its calories.
            </p>

            <form action="/nutrition" method="POST">

                <label for="food_name">Food Name</label>
                <input
                    type="text"
                    id="food_name"
                    name="food_name"
                    placeholder="Example: Chicken and rice"
                    required
                >

                <label for="calories">Calories</label>
                <input
                    type="number"
                    id="calories"
                    name="calories"
                    placeholder="Example: 450"
                    min="0"
                    required
                >

                <button type="submit">Save Food</button>

            </form>

        </section>
        
    </main>

</div>

</body>
</html>
